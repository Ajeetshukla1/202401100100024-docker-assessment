services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: festpass
      POSTGRES_USER: festpass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festpass -d festpass"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend_db

  backend:
    build:
      context: ./backend
    image: fest-backend:0.1
    restart: unless-stopped
    environment:
      REGNO: "202401100100024"
      APP_VERSION: "0.1.0"
      DB_HOST: db
      DB_NAME: festpass
      DB_USER: festpass
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend_backend
      - backend_db

  frontend:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "8024:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - frontend_backend

volumes:
  postgres_data:

networks:
  frontend_backend:
  backend_db:
    internal: true